<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none';">
<title>Recortar a tela</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair;user-select:none;font-family:system-ui,Segoe UI,sans-serif}
  #foto{position:fixed;inset:0;width:100%;height:100%;display:block}
  #veu{position:fixed;inset:0;background:rgba(0,0,0,.45)}
  #sel{position:fixed;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);display:none;pointer-events:none}
  #medida{position:fixed;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;display:none;pointer-events:none}
  #dica{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;pointer-events:none}
</style>
</head>
<body>
<img id="foto" alt="">
<div id="veu"></div>
<div id="sel"></div>
<div id="medida"></div>
<div id="dica">Arraste pra recortar · Enter confirma · Esc cancela</div>
<script src="recorte.js"></script>
</body>
</html>
